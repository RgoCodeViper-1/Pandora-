[package]
name = "android_optimizer"
version = "0.1.0"
edition = "2021"
description = "Lightweight Android Device Manager (ADB-based, no root required for core features)"

# Tauri requires a lib target so `main.rs` and mobile/test entry points can share code.
[lib]
name = "android_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: no `tokio`, no async runtime anywhere in this crate by design.
# Tauri commands below are plain synchronous functions.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
